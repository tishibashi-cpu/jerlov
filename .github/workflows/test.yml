name: tests

on:
  push:
  pull_request:
  schedule:
    # Weekly. A dependency can break this package without anyone touching it;
    # OpticalRS sat broken for seven years because nothing was watching.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["latest"]
        include:
          # pyproject.toml claims numpy>=1.22, so that claim must be tested.
          # Assuming a recent numpy is how numpy.trapezoid, added in 2.0, got
          # into a package that says it runs on 1.22.
          - python-version: "3.10"
            numpy: "oldest"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Pin the oldest supported numpy
        if: matrix.numpy == 'oldest'
        run: pip install "numpy==1.22.*"
      - run: python -c "import numpy; print('numpy', numpy.__version__)"
      - run: python -m pytest tests/ -v
      - name: The tests must also pass away from the source tree
        # The release workflow runs them from a copy next to nothing else,
        # where what needs the source tree is skipped. A test that needs it
        # but is not marked passed here and stopped 0.19.0 at the tag;
        # running the same copy here finds that before a tag does
        # (DECISIONS.md section 50).
        run: |
          cp -r tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -m pytest wheel-tests -q -p no:cacheprovider

  examples:
    # The examples run beside the tests rather than after them, on the same
    # versions and with the same commands: the same checks, finished a few
    # minutes sooner. DECISIONS.md section 49.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["latest"]
        include:
          # The same versions as the tests: a test checks they agree.
          - python-version: "3.10"
            numpy: "oldest"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Pin the oldest supported numpy
        if: matrix.numpy == 'oldest'
        run: pip install "numpy==1.22.*"
      - run: python -c "import numpy; print('numpy', numpy.__version__)"
      - name: The examples must still run, without resting on flagged values
        # An example that has stopped working should be a failed build, not
        # something a reader discovers. So should one that comes to rest on a
        # flagged value without saying so, or that shows a way of calling
        # the package has replaced (FutureWarning, DECISIONS.md section 61). `-W error::...` cannot name a
        # jerlov class before jerlov is imported, hence the filter in code.
        # wave_focusing.py takes about ten minutes, and the test job runs it
        # under the same filter (DECISIONS.md section 47).
        run: |
          for f in examples/*.py; do
            if [ "$f" = examples/wave_focusing.py ]; then
              echo "--- $f: run by tests/test_quoted_figures.py"
              continue
            fi
            echo "--- $f"
            python -c "import runpy, sys, warnings, jerlov; warnings.simplefilter('error', jerlov.ProvenanceWarning); warnings.simplefilter('error', FutureWarning); runpy.run_path(sys.argv[1], run_name='__main__')" "$f" > /dev/null
          done

  lint:
    # The package ships py.typed, which tells a caller's type checker to
    # trust its annotations, so they are checked. The versions are pinned so
    # that a new release of either tool cannot turn the weekly run red
    # without anything here having changed. DECISIONS.md section 43.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e . "ruff==0.15.20" "mypy==1.20.2"
      - run: python -c "import numpy; print('numpy', numpy.__version__)"
      - run: ruff check .
      - run: mypy
