name: tests

on:
  push:
  pull_request:
  schedule:
    # Weekly. A dependency can break this package without anyone touching it;
    # OpticalRS sat broken for seven years because nothing was watching.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/ -v
