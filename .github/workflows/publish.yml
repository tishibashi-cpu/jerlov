name: publish

# Publishes a version to PyPI and then makes its GitHub Release, whose text
# is the version's section of CHANGELOG.md (DECISIONS.md section 51). Zenodo
# archives the Release, so it comes only after PyPI has the version.
#
# Since 1.35.1 it runs by itself after a merge (DECISIONS.md section 142):
# when the tests workflow finishes on main for a push and passes, and the
# version in pyproject.toml has no tag yet. A merge that does not raise the
# version, and the weekly scheduled run of the tests, publish nothing.
# It can still be run from the Actions tab ("Run workflow" on main), and
# pushing a v* tag runs it too; a Release that already exists for the tag
# is left as it is. Uses Trusted Publishing, so no API token is stored
# anywhere.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One publication at a time: a run by hand and one after a merge must not
# both upload the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  decide:
    # After a merge, only a push to main whose tests passed; never the
    # weekly schedule, never a failed run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.version.outputs.go }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # after a merge, the commit the tests passed on, not whatever
          # main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: The tag must be the version being built
        # Three files carry the version and a test keeps them equal, but
        # nothing compared them with the tag that triggers this workflow.
        # Run by hand, there is no tag yet: it must be main, and the version
        # must not have been tagged before. After a merge, a version already
        # tagged means there is nothing to publish.
        id: version
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(python3 -c "import re, pathlib; print(re.search(r'^version = \"(.+?)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          go=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            echo "after the tests on main passed at $RUN_SHA, pyproject.toml $version"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::notice::v$version is already tagged; nothing to publish"
              go=false
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run by hand on $GITHUB_REF, pyproject.toml $version"
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::run it on main, not $GITHUB_REF"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already tagged; raise the version first"
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME#v}"
            echo "tag $GITHUB_REF_NAME, pyproject.toml $version"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: CHANGELOG.md must say what this version is
        # The Release's text, made now so that a missing section stops the
        # run before anything is uploaded. Kept apart from dist/, which is
        # what goes to PyPI.
        run: |
          mkdir notes
          python tools/release_notes.py "${{ needs.decide.outputs.version }}" > notes/release-notes.md
          cat notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The sdist must carry every tracked file
        # setuptools adds tests/*.py by itself but not tests/data/, so the
        # sdist of 1.10.1 could not run its own tests, and it had neither
        # DATA.md nor tools/. MANIFEST.in lists what goes in; this compares
        # the result with the repository (DECISIONS.md section 80).
        run: |
          python - <<'EOF'
          import glob, subprocess, sys, tarfile
          tracked = set(subprocess.run(
              ["git", "ls-files"], check=True, capture_output=True,
              text=True).stdout.split("\n")) - {""}
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as archive:
              found = {name.split("/", 1)[1] for name in archive.getnames()
                       if "/" in name}
          missing = sorted(tracked - found)
          print(f"{sdist}: {len(tracked) - len(missing)} of {len(tracked)} "
                "tracked files")
          if missing:
              sys.exit("missing from the sdist: " + ", ".join(missing))
          EOF

      - name: The wheel must carry every data table in the source tree
        # A wheel that installs but cannot find its own CSVs is the classic
        # packaging failure. Counting the source tree rather than hard-coding
        # a number means adding a table does not also mean editing this file;
        # forgetting to do so stopped three releases.
        run: |
          python - <<'EOF'
          import glob, pathlib, sys, zipfile
          expected = {p.name for p in pathlib.Path("jerlov/data").glob("*.csv")}
          wheel = glob.glob("dist/*.whl")[0]
          found = {pathlib.PurePosixPath(n).name
                   for n in zipfile.ZipFile(wheel).namelist()
                   if n.endswith(".csv")}
          print(f"{wheel}: {len(found)} of {len(expected)} tables")
          for name in sorted(expected | found):
              mark = "  " if name in expected & found else "!!"
              print(f"  {mark} {name}")
          if not expected:
              sys.exit("no data tables found in the source tree at all")
          if found != expected:
              sys.exit(f"missing from the wheel: {sorted(expected - found)}; "
                       f"unexpected in the wheel: {sorted(found - expected)}")
          EOF

      - name: The installed package must work from the wheel alone
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"      # away from the source tree
          python - <<'EOF'
          import jerlov
          w = jerlov.water("III")
          print(w, "a(550) =", w.a(550))
          assert jerlov.__version__
          EOF

      - name: The test suite must pass against the installed wheel
        # The tests skip what only a source tree has (pyproject.toml, the
        # README), so they can be run from a copy next to nothing else and
        # import the wheel rather than the checkout.
        run: |
          python -m pip install pytest
          cp -r tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -c "import jerlov; print('testing', jerlov.__file__)"
          python -m pytest wheel-tests -q -p no:cacheprovider

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: notes/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # After PyPI has the version, never before: a Release is what Zenodo
    # archives, and 0.19.0 reached Zenodo without reaching PyPI.
    needs: [decide, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to make the tag and the Release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes/
      - name: Make the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          # the commit that was built; after a merge GITHUB_SHA is main's
          # head when this workflow started, which may be later
          TARGET: ${{ needs.decide.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::the Release $TAG already exists and is left as it is"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" --title "$TAG" \
            --notes-file notes/release-notes.md
