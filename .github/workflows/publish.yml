name: publish

# Publishes to PyPI when a version tag is pushed. Uses Trusted Publishing, so
# no API token is stored anywhere.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel must carry every data table in the source tree
        # A wheel that installs but cannot find its own CSVs is the classic
        # packaging failure. Counting the source tree rather than hard-coding
        # a number means adding a table does not also mean editing this file;
        # forgetting to do so stopped three releases.
        run: |
          python - <<'EOF'
          import glob, pathlib, sys, zipfile
          expected = {p.name for p in pathlib.Path("jerlov/data").glob("*.csv")}
          wheel = glob.glob("dist/*.whl")[0]
          found = {pathlib.PurePosixPath(n).name
                   for n in zipfile.ZipFile(wheel).namelist()
                   if n.endswith(".csv")}
          print(f"{wheel}: {len(found)} of {len(expected)} tables")
          for name in sorted(expected | found):
              mark = "  " if name in expected & found else "!!"
              print(f"  {mark} {name}")
          if not expected:
              sys.exit("no data tables found in the source tree at all")
          if found != expected:
              sys.exit(f"missing from the wheel: {sorted(expected - found)}; "
                       f"unexpected in the wheel: {sorted(found - expected)}")
          EOF

      - name: The installed package must work from the wheel alone
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"      # away from the source tree
          python - <<'EOF'
          import jerlov
          w = jerlov.water("III")
          print(w, "a(550) =", w.a(550))
          assert jerlov.__version__
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
