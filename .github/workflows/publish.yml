name: publish

# Publishes to PyPI when a version tag is pushed. Uses Trusted Publishing, so
# no API token is stored anywhere.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must be the version being built
        # Three files carry the version and a test keeps them equal, but
        # nothing compared them with the tag that triggers this workflow.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re, pathlib; print(re.search(r'^version = \"(.+?)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          echo "tag $GITHUB_REF_NAME, pyproject.toml $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel must carry every data table in the source tree
        # A wheel that installs but cannot find its own CSVs is the classic
        # packaging failure. Counting the source tree rather than hard-coding
        # a number means adding a table does not also mean editing this file;
        # forgetting to do so stopped three releases.
        run: |
          python - <<'EOF'
          import glob, pathlib, sys, zipfile
          expected = {p.name for p in pathlib.Path("jerlov/data").glob("*.csv")}
          wheel = glob.glob("dist/*.whl")[0]
          found = {pathlib.PurePosixPath(n).name
                   for n in zipfile.ZipFile(wheel).namelist()
                   if n.endswith(".csv")}
          print(f"{wheel}: {len(found)} of {len(expected)} tables")
          for name in sorted(expected | found):
              mark = "  " if name in expected & found else "!!"
              print(f"  {mark} {name}")
          if not expected:
              sys.exit("no data tables found in the source tree at all")
          if found != expected:
              sys.exit(f"missing from the wheel: {sorted(expected - found)}; "
                       f"unexpected in the wheel: {sorted(found - expected)}")
          EOF

      - name: The installed package must work from the wheel alone
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"      # away from the source tree
          python - <<'EOF'
          import jerlov
          w = jerlov.water("III")
          print(w, "a(550) =", w.a(550))
          assert jerlov.__version__
          EOF

      - name: The test suite must pass against the installed wheel
        # The tests skip what only a source tree has (pyproject.toml, the
        # README), so they can be run from a copy next to nothing else and
        # import the wheel rather than the checkout.
        run: |
          python -m pip install pytest
          cp -r tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -c "import jerlov; print('testing', jerlov.__file__)"
          python -m pytest wheel-tests -q -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
