name: publish

# Publishes a version to PyPI and then makes its GitHub Release, whose text
# is the version's section of CHANGELOG.md (DECISIONS.md section 51). Zenodo
# archives the Release, so it comes only after PyPI has the version.
#
# Run it from the Actions tab ("Run workflow" on main): it takes the version
# from pyproject.toml and makes the tag with the Release. Pushing a v* tag
# runs it too; a Release that already exists for the tag is left as it is.
# Uses Trusted Publishing, so no API token is stored anywhere.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tag must be the version being built
        # Three files carry the version and a test keeps them equal, but
        # nothing compared them with the tag that triggers this workflow.
        # Run by hand, there is no tag yet: it must be main, and the version
        # must not have been tagged before.
        id: version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'^version = \"(.+?)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run by hand on $GITHUB_REF, pyproject.toml $version"
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::run it on main, not $GITHUB_REF"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already tagged; raise the version first"
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME#v}"
            echo "tag $GITHUB_REF_NAME, pyproject.toml $version"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG.md must say what this version is
        # The Release's text, made now so that a missing section stops the
        # run before anything is uploaded. Kept apart from dist/, which is
        # what goes to PyPI.
        run: |
          mkdir notes
          python tools/release_notes.py "${{ steps.version.outputs.version }}" > notes/release-notes.md
          cat notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel must carry every data table in the source tree
        # A wheel that installs but cannot find its own CSVs is the classic
        # packaging failure. Counting the source tree rather than hard-coding
        # a number means adding a table does not also mean editing this file;
        # forgetting to do so stopped three releases.
        run: |
          python - <<'EOF'
          import glob, pathlib, sys, zipfile
          expected = {p.name for p in pathlib.Path("jerlov/data").glob("*.csv")}
          wheel = glob.glob("dist/*.whl")[0]
          found = {pathlib.PurePosixPath(n).name
                   for n in zipfile.ZipFile(wheel).namelist()
                   if n.endswith(".csv")}
          print(f"{wheel}: {len(found)} of {len(expected)} tables")
          for name in sorted(expected | found):
              mark = "  " if name in expected & found else "!!"
              print(f"  {mark} {name}")
          if not expected:
              sys.exit("no data tables found in the source tree at all")
          if found != expected:
              sys.exit(f"missing from the wheel: {sorted(expected - found)}; "
                       f"unexpected in the wheel: {sorted(found - expected)}")
          EOF

      - name: The installed package must work from the wheel alone
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"      # away from the source tree
          python - <<'EOF'
          import jerlov
          w = jerlov.water("III")
          print(w, "a(550) =", w.a(550))
          assert jerlov.__version__
          EOF

      - name: The test suite must pass against the installed wheel
        # The tests skip what only a source tree has (pyproject.toml, the
        # README), so they can be run from a copy next to nothing else and
        # import the wheel rather than the checkout.
        run: |
          python -m pip install pytest
          cp -r tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -c "import jerlov; print('testing', jerlov.__file__)"
          python -m pytest wheel-tests -q -p no:cacheprovider

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: notes/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # After PyPI has the version, never before: a Release is what Zenodo
    # archives, and 0.19.0 reached Zenodo without reaching PyPI.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to make the tag and the Release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes/
      - name: Make the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::the Release $TAG already exists and is left as it is"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file notes/release-notes.md
