name: publish

# Publishes to PyPI when a version tag is pushed. Uses Trusted Publishing, so
# no API token is stored anywhere.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel must carry the data tables
        # A wheel that installs but cannot find its own CSVs is the classic
        # packaging failure. Fail here rather than after publishing.
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          csvs = sorted(n for n in names if n.endswith(".csv"))
          print(f"{wheel} contains {len(csvs)} CSV files:")
          for n in csvs:
              print("  ", n)
          if len(csvs) != 9:
              sys.exit(f"expected 9 data tables in the wheel, found {len(csvs)}")
          EOF

      - name: The installed package must work from the wheel alone
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"      # away from the source tree
          python - <<'EOF'
          import jerlov
          w = jerlov.water("III")
          print(w, "a(550) =", w.a(550))
          assert jerlov.__version__
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
