{#- The theme's layout, with a card for sharing (DECISIONS.md section 120):
    Open Graph and Twitter tags naming the page and docs/extra/og.png. -#}
{% extends "!layout.html" %}
{% block extrahead %}
{{ super() }}
<meta property="og:type" content="website">
<meta property="og:site_name" content="jerlov">
<meta property="og:title" content="{{ title|striptags|e }} · jerlov">
<meta property="og:description" content="The Jerlov optical water types, with provenance: absorption, scattering and Kd from the papers that published them.">
<meta property="og:image" content="{{ theme_og_root }}og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% if pageurl %}<meta property="og:url" content="{{ pageurl }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
{% endblock %}
