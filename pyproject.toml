[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jerlov"
version = "0.21.0"
description = "Inherent optical properties of Jerlov water types, with provenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "T. Ishibashi"}]
keywords = ["ocean optics", "Jerlov water types", "inherent optical properties"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest"]
build = ["openpyxl", "colour-science"]

[tool.setuptools.packages.find]
include = ["jerlov*"]

[tool.setuptools.package-data]
"jerlov.data" = ["*.csv"]
"jerlov" = ["py.typed"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# The default rules, which find unused names and code that cannot run, plus
# the line length. The length is held in the package only: the examples
# print paragraphs from f-strings whose source lines are long though the
# printed lines are not, and the build scripts carry transcribed rows one to
# a line. DECISIONS.md section 43.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
"tests/*" = ["E501"]
"tools/*" = ["E501", "E701", "E702", "E402"]

[tool.mypy]
files = ["jerlov"]
